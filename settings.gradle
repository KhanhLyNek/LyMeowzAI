pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'lymeowzai'

// Mỗi thư mục trong versions/ là một bản build cho một nhóm phiên bản Minecraft.
file('versions').eachDir { dir ->
    if (new File(dir, 'gradle.properties').exists()) {
        include ":${dir.name}"
        project(":${dir.name}").projectDir = dir
    }
}
